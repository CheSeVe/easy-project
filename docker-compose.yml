services:
  app:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      APP_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      APP_DATASOURCE_USERNAME: ${DB_USER}
      APP_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      SUBS_BASE_URL: ${SUBS_BASE_URL}
      SUBS_CONNECT_TIMEOUT: ${SUBS_CONNECT_TIMEOUT:-1s}
      SUBS_READ_TIMEOUT: ${SUBS_READ_TIMEOUT:-2s}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
      - backend-network

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
  backend-network:
    external: true
    name: easy-project-backend

volumes:
  postgres_data: