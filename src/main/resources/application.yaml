server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: easy-project
  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5433/crm}
    username: ${APP_DATASOURCE_USERNAME:crmuser}
    password: ${APP_DATASOURCE_PASSWORD:crmpassword}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

subs:
  base-url: ${SUBS_BASE_URL:http://localhost:8081}
  connect-timeout: ${SUBS_CONNECT_TIMEOUT:1s}
  read-timeout: ${SUBS_READ_TIMEOUT:2s}

logging:
  level:
    root: INFO
    ru.cheseve.easyproject: DEBUG