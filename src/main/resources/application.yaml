spring:
  application:
    name: easy-project
  datasource:
    url: jdbc:postgresql://localhost:5432/shitty_database
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration